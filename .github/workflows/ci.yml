name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request replaces its run. On main every commit's run finishes: jobs are skipped when a commit
# doesn't touch their part, so a cancelled run could leave a change that was never checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.diff.outputs.server }}
      web: ${{ steps.diff.outputs.web }}
      apple: ${{ steps.diff.outputs.apple }}
      android: ${{ steps.diff.outputs.android }}
      guide: ${{ steps.diff.outputs.guide }}
      apps: ${{ steps.diff.outputs.apps }}
      tokens: ${{ steps.diff.outputs.tokens }}
      relay: ${{ steps.diff.outputs.relay }}
      tunnel: ${{ steps.diff.outputs.tunnel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Everything when there's nothing to compare with (a new branch, a force push) or this workflow changed.
          if files=$(git diff --name-only "$BASE" "$GITHUB_SHA" 2>/dev/null) && ! grep -q '^\.github/workflows/ci\.yml$' <<<"$files"; then
            has() { grep -qE "$1" <<<"$files" && echo true || echo false; }
          else
            has() { echo true; }
          fi
          # The server embeds the changelog, and its version test reads the web and Apple apps' versions.
          echo "server=$(has '^(src/|tests/|Directory\.|global\.json|dotnet-tools\.json|Flexarr\.slnx|\.editorconfig|CHANGELOG\.md|frontend/package\.json|clients/apple/project\.yml)')" >>"$GITHUB_OUTPUT"
          echo "web=$(has '^(frontend/|\.nvmrc)')" >>"$GITHUB_OUTPUT"
          # The apps carry the tunnel (clients/tunnel), so a change to it builds them too.
          echo "apple=$(has '^clients/(apple|tunnel)/')" >>"$GITHUB_OUTPUT"
          # The Android app's version is the server's, and its tests read FlexarrKit's fixtures.
          echo "android=$(has '^(clients/android/|clients/tunnel/|Directory\.Build\.props|clients/apple/FlexarrKit/Tests/FlexarrKitTests/Fixtures/)')" >>"$GITHUB_OUTPUT"
          echo "guide=$(has '^(docs/guide/|scripts/guide/|site/guide/)')" >>"$GITHUB_OUTPUT"
          echo "apps=$(has '^(site/apps\.|scripts/apps/)')" >>"$GITHUB_OUTPUT"
          echo "tokens=$(has '^(design/|scripts/design/|frontend/src/styles/tokens\.generated\.css|frontend/src/components/icons(\.generated\.ts|\.tsx)|clients/apple/Shared/Design/(Tokens|Icons)\.swift|clients/android/app/src/main/kotlin/io/github/flexarr/ui/theme/(Tokens|FlexarrIcons)\.kt)')" >>"$GITHUB_OUTPUT"
          echo "relay=$(has '^relay/')" >>"$GITHUB_OUTPUT"
          echo "tunnel=$(has '^clients/tunnel/')" >>"$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  server:
    name: Server (.NET)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release

  web:
    name: Web client
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # flexarr.io/guide is built from docs/guide and committed; this fails when someone forgot `make guide`.
  guide:
    name: Guide
    needs: changes
    if: needs.changes.outputs.guide == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/guide
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: scripts/guide/package-lock.json
      - run: npm ci
      - run: node build.mjs --check

  # flexarr.io/apps is built from site/apps.json and committed; this fails when someone forgot `make apps`.
  apps:
    name: Apps page
    needs: changes
    if: needs.changes.outputs.apps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/apps/build.mjs --check

  # The clients' colours and radii are generated from design/tokens.json; this fails when someone forgot `make tokens`.
  tokens:
    name: Design tokens
    needs: changes
    if: needs.changes.outputs.tokens == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/design/tokens.py --check
      - run: python3 -m unittest discover -s scripts/design

  # The apps' notification relay (push.flexarr.io), deployed by Vercel when relay/ changes.
  relay:
    name: Push relay
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node --test relay/test/*.test.js

  # The Tailscale tunnel the apps carry for family guests (clients/tunnel, Go).
  tunnel:
    name: Tunnel (Go)
    needs: changes
    if: needs.changes.outputs.tunnel == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/tunnel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: clients/tunnel/go.mod
          cache-dependency-path: clients/tunnel/go.sum
      - run: go vet ./...
      - run: go test ./...

  apple:
    name: Apple (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    # The Apple apps (and AetherEngine, which they build) need Xcode 27: GitHub's xcode-27 image, not macos-latest
    # (Xcode 26.6, whose Swift rejects the engine's sources).
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: FlexarrKit
            scheme: ""
          - name: tvOS
            scheme: FlexarrTV
          # Release, as the App Store and device installs build it: code under #if DEBUG can't hide a Release-only error.
          - name: iOS
            scheme: FlexarriOS
            configuration: Release
    defaults:
      run:
        working-directory: clients/apple
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: FlexarrKit tests
        if: matrix.scheme == ''
        run: swift test
        working-directory: clients/apple/FlexarrKit
      # The last build's products and packages: AetherEngine and FFmpeg, most of the build, are compiled once, not
      # every run. A new key when the packages or the project change; the newest older one is the starting point.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.scheme != ''
        with:
          path: clients/apple/build/DerivedData
          key: apple-${{ matrix.scheme }}-${{ hashFiles('clients/apple/project.yml', 'clients/apple/FlexarrKit/Package.swift') }}
          restore-keys: apple-${{ matrix.scheme }}-
      # The tunnel's xcframework, built once per change to its sources.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.scheme != ''
        with:
          go-version-file: clients/tunnel/go.mod
          cache-dependency-path: clients/tunnel/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.scheme != ''
        id: tunnel
        with:
          path: clients/tunnel/build/FlexarrTunnel.xcframework
          key: tunnel-apple-${{ matrix.scheme }}-${{ hashFiles('clients/tunnel/**/*.go', 'clients/tunnel/go.sum', 'clients/tunnel/*.sh') }}
      - name: Build the tunnel
        if: matrix.scheme != '' && steps.tunnel.outputs.cache-hit != 'true'
        run: ../tunnel/build-apple.sh ${{ matrix.scheme == 'FlexarrTV' && 'tvos' || 'ios' }}
      - name: Build ${{ matrix.name }} app
        if: matrix.scheme != ''
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Flexarr.xcodeproj -scheme ${{ matrix.scheme }} \
            -destination 'generic/platform=${{ matrix.name }}' -derivedDataPath build/DerivedData \
            -configuration ${{ matrix.configuration || 'Debug' }} CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build

  # The Android app (clients/android, in development), as three jobs side by side: the core's and the app's unit tests
  # with the debug build; the release build as Google Play gets it, minified but unsigned (the upload key isn't here)
  # and with no Sentry upload (no token); and lint on the release build: errors not in app/lint-baseline.xml fail. The
  # release build skips its own lint pass (lintVital), a subset of the full lint the third job runs.
  android:
    name: Android (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tests
            tasks: ":core:test :app:testDebugUnitTest :app:assembleDebug"
          - name: release
            tasks: ":app:assembleRelease -x lintVitalRelease"
          - name: lint
            tasks: ":app:lintRelease"
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # The tunnel's AAR, built once per change to its sources.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: clients/tunnel/go.mod
          cache-dependency-path: clients/tunnel/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tunnel
        with:
          # With the hash of its sources Gradle compares, so a restored AAR isn't built again.
          path: |
            clients/tunnel/build/flexarr-tunnel.aar
            clients/tunnel/build/flexarr-tunnel.aar.hash
          key: tunnel-android-v2-${{ hashFiles('clients/tunnel/*.go', 'clients/tunnel/go.mod', 'clients/tunnel/go.sum', 'clients/tunnel/tags.sh', 'clients/tunnel/build-android.sh') }}
      - name: Build the tunnel
        if: steps.tunnel.outputs.cache-hit != 'true'
        run: ./gradlew :app:buildTunnel
      - run: ./gradlew ${{ matrix.tasks }}

  # The one check main's ruleset requires: the jobs above are skipped when a commit doesn't touch their part, and a
  # skipped matrix job never reports under its real name, so requiring them directly would block every merge.
  passed:
    name: CI passed
    needs: [changes, server, web, guide, apps, tokens, relay, tunnel, apple, android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          ! grep -qE 'failure|cancelled' <<<"$RESULTS"
