name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request replaces its run. On main every commit's run finishes: jobs are skipped when a commit
# doesn't touch their part, so a cancelled run could leave a change that was never checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.diff.outputs.server }}
      web: ${{ steps.diff.outputs.web }}
      apple: ${{ steps.diff.outputs.apple }}
      guide: ${{ steps.diff.outputs.guide }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Everything when there's nothing to compare with (a new branch, a force push) or this workflow changed.
          if files=$(git diff --name-only "$BASE" "$GITHUB_SHA" 2>/dev/null) && ! grep -q '^\.github/workflows/ci\.yml$' <<<"$files"; then
            has() { grep -qE "$1" <<<"$files" && echo true || echo false; }
          else
            has() { echo true; }
          fi
          # The server embeds the changelog, and its version test reads the web and Apple apps' versions.
          echo "server=$(has '^(src/|tests/|Directory\.|global\.json|dotnet-tools\.json|Flexarr\.slnx|\.editorconfig|CHANGELOG\.md|frontend/package\.json|clients/apple/project\.yml)')" >>"$GITHUB_OUTPUT"
          echo "web=$(has '^(frontend/|\.nvmrc)')" >>"$GITHUB_OUTPUT"
          echo "apple=$(has '^clients/apple/')" >>"$GITHUB_OUTPUT"
          echo "guide=$(has '^(docs/guide/|scripts/guide/|site/guide/)')" >>"$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  server:
    name: Server (.NET)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release

  web:
    name: Web client
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # flexarr.io/guide is built from docs/guide and committed; this fails when someone forgot `make guide`.
  guide:
    name: Guide
    needs: changes
    if: needs.changes.outputs.guide == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/guide
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: scripts/guide/package-lock.json
      - run: npm ci
      - run: node build.mjs --check

  apple:
    name: Apple (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    # The Apple apps (and AetherEngine, which they build) need Xcode 27: GitHub's xcode-27 image, not macos-latest
    # (Xcode 26.6, whose Swift rejects the engine's sources).
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: FlexarrKit
            scheme: ""
          - name: tvOS
            scheme: FlexarrTV
          - name: iOS
            scheme: FlexarriOS
    defaults:
      run:
        working-directory: clients/apple
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: FlexarrKit tests
        if: matrix.scheme == ''
        run: swift test
        working-directory: clients/apple/FlexarrKit
      # The last build's products and packages: AetherEngine and FFmpeg, most of the build, are compiled once, not
      # every run. A new key when the packages or the project change; the newest older one is the starting point.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.scheme != ''
        with:
          path: clients/apple/build/DerivedData
          key: apple-${{ matrix.scheme }}-${{ hashFiles('clients/apple/project.yml', 'clients/apple/FlexarrKit/Package.swift') }}
          restore-keys: apple-${{ matrix.scheme }}-
      - name: Build ${{ matrix.name }} app
        if: matrix.scheme != ''
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Flexarr.xcodeproj -scheme ${{ matrix.scheme }} \
            -destination 'generic/platform=${{ matrix.name }}' -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build

  # The one check main's ruleset requires: the jobs above are skipped when a commit doesn't touch their part, and a
  # skipped matrix job never reports under its real name, so requiring them directly would block every merge.
  passed:
    name: CI passed
    needs: [changes, server, web, guide, apple]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          ! grep -qE 'failure|cancelled' <<<"$RESULTS"
