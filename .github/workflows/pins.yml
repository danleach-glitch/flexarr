name: Pinned packages

# Dependabot can't read clients/apple/project.yml, so this opens the pull requests for the packages pinned there
# (scripts/pins/check.mjs). It needs PINS_TOKEN, a fine-grained token for this repository with Contents and Pull
# requests read-write: pull requests opened with the workflow's own token wouldn't start CI, and this repository
# doesn't let Actions open them anyway.
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pins

jobs:
  check:
    name: Check pinned packages
    runs-on: ubuntu-latest
    steps:
      - name: Token
        env:
          PINS_TOKEN: ${{ secrets.PINS_TOKEN }}
        run: |
          if [ -z "$PINS_TOKEN" ]; then
            echo "::error::PINS_TOKEN isn't set: add a fine-grained token (Contents and Pull requests read-write on this repository) as a repository secret."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.PINS_TOKEN }}
      - name: Labels
        env:
          GH_TOKEN: ${{ secrets.PINS_TOKEN }}
        run: gh label create "needs device test" --color fbca04 --description "Try it on the Apple TV and iPhone before landing" --force
      - name: Check
        env:
          GH_TOKEN: ${{ secrets.PINS_TOKEN }}
        run: node scripts/pins/check.mjs

  # The tunnel both phone apps carry (clients/tunnel) brings in Tailscale and everything it needs, mostly not named by
  # the tunnel itself, so Dependabot leaves those alone. This fails when Go's vulnerability database lists a fault in
  # code the tunnel can reach, checked as each phone builds it (needs no token).
  tunnel:
    name: Check the tunnel for known faults
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/tunnel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: clients/tunnel/go.mod
          cache-dependency-path: clients/tunnel/go.sum
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          for os in android ios; do
            echo "== $os"
            GOOS=$os GOARCH=arm64 CGO_ENABLED=0 "$(go env GOPATH)/bin/govulncheck" -tags "$(sh tags.sh)" .
          done
