name: Pinned packages

# Dependabot can't read clients/apple/project.yml, so this opens the pull requests for the packages pinned there
# (scripts/pins/check.mjs). It needs PINS_TOKEN, a fine-grained token for this repository with Contents and Pull
# requests read-write: pull requests opened with the workflow's own token wouldn't start CI, and this repository
# doesn't let Actions open them anyway.
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pins

jobs:
  check:
    name: Check pinned packages
    runs-on: ubuntu-latest
    steps:
      - name: Token
        env:
          PINS_TOKEN: ${{ secrets.PINS_TOKEN }}
        run: |
          if [ -z "$PINS_TOKEN" ]; then
            echo "::error::PINS_TOKEN isn't set: add a fine-grained token (Contents and Pull requests read-write on this repository) as a repository secret."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.PINS_TOKEN }}
      - name: Labels
        env:
          GH_TOKEN: ${{ secrets.PINS_TOKEN }}
        run: gh label create "needs device test" --color fbca04 --description "Try it on the Apple TV and iPhone before landing" --force
      - name: Check
        env:
          GH_TOKEN: ${{ secrets.PINS_TOKEN }}
        run: node scripts/pins/check.mjs
