# Generate the Xcode project with: xcodegen generate
# The .xcodeproj is build output and is not committed.
name: Flexarr
options:
  bundleIdPrefix: io.github.flexarr
  deploymentTarget:
    tvOS: "18.2"
    iOS: "18.2"
    macOS: "15.2"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.64.0"
    CURRENT_PROJECT_VERSION: "1"
    # The Apple TV app's bundle ID; its Top Shelf extension's is this plus .topshelf. `make apple-install` sets it.
    FLEXARR_TV_BUNDLE_ID: io.github.flexarr.tv
    # The iPhone and iPad app's bundle ID; its widgets' is this plus .widgets, and the app group they share is
    # group.<this>. Set it rather than PRODUCT_BUNDLE_IDENTIFIER, which would give the widgets the app's own.
    FLEXARR_IOS_BUNDLE_ID: io.github.flexarr.ios
    # The Mac app's (the player; Flexarr Server is clients/macos). It ships under the iPhone app's bundle ID
    # (universal purchase, like the TV app); this one is for running it at home. `make mac-player-install` sets it.
    FLEXARR_MAC_PLAYER_BUNDLE_ID: io.github.flexarr.mac
    # Joining someone's Flexarr (family invites) is offered: NO until servers have family invites switched on; a
    # release turns it to YES. Debug builds and `-FlexarrGuestInvites YES` offer it anyway (GuestInvite.guestInvitesOffered).
    FLEXARR_GUEST_INVITES: "NO"
packages:
  FlexarrKit:
    path: FlexarrKit
  # Plays files as they are on the device, FFmpeg demuxing and VideoToolbox decoding. Pinned: a new release reaches
  # the TV only after it has been tried on one. .github/workflows/pins.yml opens a pull request when a newer one is out.
  AetherEngine:
    url: https://github.com/superuser404notfound/AetherEngine
    exactVersion: 7.54.0
  # Error reports (crashes and errors), only when the server's owner turns them on. Pinned: it runs at launch.
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 9.32.0
targets:
  FlexarrTV:
    type: application
    platform: tvOS
    preBuildScripts:
      # The tunnel's library, built once if it isn't there (make tunnel-apple rebuilds it when its sources change).
      - name: Build the tunnel if missing
        basedOnDependencyAnalysis: false
        script: |
          [ -d "$SRCROOT/../tunnel/build/FlexarrTunnel.xcframework" ] || PATH="$PATH:/opt/homebrew/bin:/usr/local/go/bin" make -C "$SRCROOT/../.." tunnel-apple
    # Shared/ is the app model, player and design tokens both apps use.
    # Languages/: what tvOS reads itself (Shortcuts and Siri text, Info.plist prompts) in every bundled language, written by
    # make strings. Their languages are what the App Store lists.
    sources: [Shared, FlexarrTV, Languages/Localizable.xcstrings, Languages/AppShortcuts.xcstrings, Languages/FlexarrTV/InfoPlist.xcstrings]
    dependencies:
      - package: FlexarrKit
      - package: AetherEngine
      - package: Sentry
        product: Sentry
      - target: FlexarrTopShelf
      # Tailscale built in, for family guests (clients/tunnel, a static library built by make tunnel-apple).
      - framework: ../tunnel/build/FlexarrTunnel.xcframework
        embed: false
    entitlements:
      path: FlexarrTV/FlexarrTV.entitlements
      properties:
        # The sign-in shared between the app and its Top Shelf extension.
        keychain-access-groups: [$(AppIdentifierPrefix)io.github.flexarr.shared]
    info:
      path: FlexarrTV/Info.plist
      properties:
        CFBundleDisplayName: Flexarr
        # Big Shoulders Display, the marquee type (Shared/Fonts; SIL Open Font License, OFL.txt beside them).
        UIAppFonts: [BigShouldersDisplay-Bold.ttf, BigShouldersDisplay-ExtraBold.ttf, BigShouldersDisplay-Black.ttf]
        # Export compliance: exempt. Besides Apple's own HTTPS and CryptoKit, the apps carry Tailscale for family
        # guests (WireGuard: standard ChaCha20-Poly1305 and Curve25519, from open-source code). Flexarr's primary
        # function is playing the user's own media, not information security, so under Category 5 Part 2's Note 4
        # the encryption that serves it isn't controlled. Revisit if the apps ever ship encryption of their own design
        # or whose main purpose is security.
        ITSAppUsesNonExemptEncryption: false
        # Where the sign-in is shared with the Top Shelf extension.
        FlexarrKeychainGroup: $(AppIdentifierPrefix)io.github.flexarr.shared
        FlexarrGuestInvites: $(FLEXARR_GUEST_INVITES)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Self-hosted servers are usually plain HTTP on the LAN.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Flexarr looks for your Flexarr server on your home network so you can connect without typing an address, then streams from it. For example, it finds the server on your Mac and plays your movies, shows and music from it."
        # Servers announce themselves (Bonjour) so the connect screen can list them.
        NSBonjourServices: [_flexarr._tcp]
        # A title's Trailer opens the YouTube app, and shows only when it's installed.
        LSApplicationQueriesSchemes: [youtube]
        # flexarr://item/<id> opens a title, flexarr://play/<id> plays it.
        CFBundleURLTypes:
          - CFBundleURLName: io.github.flexarr.tv
            CFBundleURLSchemes: [flexarr]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLEXARR_TV_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
  # Continue Watching on the Apple TV Home screen's Top Shelf.
  FlexarrTopShelf:
    type: app-extension
    platform: tvOS
    sources: [FlexarrTopShelf]
    dependencies:
      - package: FlexarrKit
    entitlements:
      path: FlexarrTopShelf/FlexarrTopShelf.entitlements
      properties:
        # The sign-in shared between the app and its Top Shelf extension.
        keychain-access-groups: [$(AppIdentifierPrefix)io.github.flexarr.shared]
    info:
      path: FlexarrTopShelf/Info.plist
      properties:
        CFBundleDisplayName: Flexarr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FlexarrKeychainGroup: $(AppIdentifierPrefix)io.github.flexarr.shared
        # App Store uploads refuse a 64-bit extension without it.
        UIRequiredDeviceCapabilities: [arm64]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLEXARR_TV_BUNDLE_ID).topshelf
        TARGETED_DEVICE_FAMILY: "3"
  FlexarriOS:
    type: application
    platform: iOS
    preBuildScripts:
      # The tunnel's library, built once if it isn't there (make tunnel-apple rebuilds it when its sources change).
      - name: Build the tunnel if missing
        basedOnDependencyAnalysis: false
        script: |
          [ -d "$SRCROOT/../tunnel/build/FlexarrTunnel.xcframework" ] || PATH="$PATH:/opt/homebrew/bin:/usr/local/go/bin" make -C "$SRCROOT/../.." tunnel-apple
    # WidgetShared is what the app and its widgets both know: the snapshot it writes for them, the Play/Pause intent.
    # Languages/: what iOS reads itself (Shortcuts and Siri text, Info.plist prompts) in every bundled language, written by
    # make strings. Their languages are what the App Store lists.
    sources: [Shared, FlexarriOS, WidgetShared, Languages/Localizable.xcstrings, Languages/AppShortcuts.xcstrings, Languages/FlexarriOS/InfoPlist.xcstrings]
    dependencies:
      - package: FlexarrKit
      - package: AetherEngine
      - package: Sentry
        product: Sentry
      - target: FlexarrWidgets
      - target: FlexarrNotificationService
      # Tailscale built in, for family guests (clients/tunnel, a static library built by make tunnel-apple).
      - framework: ../tunnel/build/FlexarrTunnel.xcframework
        embed: false
    info:
      path: FlexarriOS/Info.plist
      properties:
        CFBundleDisplayName: Flexarr
        # Big Shoulders Display, the marquee type (Shared/Fonts; SIL Open Font License, OFL.txt beside them).
        UIAppFonts: [BigShouldersDisplay-Bold.ttf, BigShouldersDisplay-ExtraBold.ttf, BigShouldersDisplay-Black.ttf]
        FlexarrAppGroup: group.$(FLEXARR_IOS_BUNDLE_ID)
        FlexarrGuestInvites: $(FLEXARR_GUEST_INVITES)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # CarPlay's own scene (podcasts in the car). Without the CarPlay entitlement (see FLEXARR_IOS_ENTITLEMENTS) the
        # car never asks for it; the phone's window is SwiftUI's as before.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # What a TV in the house is playing, on the Lock Screen (the iPhone's remote).
        NSSupportsLiveActivities: true
        # Playing on in Picture in Picture and with the screen locked; fetch is the podcast refresh, which keeps
        # the newest episodes of followed shows on the phone.
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [io.github.flexarr.podcasts]
        UIUserInterfaceStyle: Dark
        # Self-hosted servers are usually plain HTTP on the LAN.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Flexarr looks for your Flexarr server on your home network so you can connect without typing an address, then streams from it. For example, it finds the server on your Mac and plays your movies, shows, music and podcasts from it."
        # Servers announce themselves (Bonjour) so the connect screen can list them.
        NSBonjourServices: [_flexarr._tcp]
        # flexarr://item/<id> opens a title, flexarr://play/<id> plays it.
        CFBundleURLTypes:
          - CFBundleURLName: io.github.flexarr.ios
            CFBundleURLSchemes: [flexarr]
        # Export compliance: exempt. Besides Apple's own HTTPS and CryptoKit, the apps carry Tailscale for family
        # guests (WireGuard: standard ChaCha20-Poly1305 and Curve25519, from open-source code). Flexarr's primary
        # function is playing the user's own media, not information security, so under Category 5 Part 2's Note 4
        # the encryption that serves it isn't controlled. Revisit if the apps ever ship encryption of their own design
        # or whose main purpose is security.
        ITSAppUsesNonExemptEncryption: false
        # How "Flexarr" tends to come out of speech recognition, so Siri still knows which app is meant.
        # App Store Connect rejects more than three per language (ITMS-90626).
        INAlternativeAppNames:
          - INAlternativeAppName: Flexar
          - INAlternativeAppName: Flexer
          - INAlternativeAppName: Flex are
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLEXARR_IOS_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The app group (shared with the widgets and the notification extension), push notifications and CarPlay need a
        # provisioning profile that includes them: the app
        # group once Xcode is signed in to the team's account, CarPlay once Apple grants the entitlement. Until then
        # device builds go without both (the widgets show nothing, the car doesn't list the app); the simulator
        # always has them. For a device build pass FLEXARR_IOS_ENTITLEMENTS=FlexarriOS/FlexarriOS.entitlements (the
        # app group) or FlexarriOS/FlexarriOS-CarPlay.entitlements (the app group and CarPlay).
        FLEXARR_IOS_ENTITLEMENTS: ""
        "FLEXARR_IOS_ENTITLEMENTS[sdk=iphonesimulator*]": FlexarriOS/FlexarriOS-CarPlay.entitlements
        CODE_SIGN_ENTITLEMENTS: $(FLEXARR_IOS_ENTITLEMENTS)
  # The Mac app: the player, browsing and playing from a server the way the iPad app does (docs/mac-player.md).
  # Not Flexarr Server, which is clients/macos.
  FlexarrMac:
    type: application
    platform: macOS
    preBuildScripts:
      # The tunnel's library, built once if it isn't there (make tunnel-apple rebuilds it when its sources change).
      - name: Build the tunnel if missing
        basedOnDependencyAnalysis: false
        script: |
          [ -d "$SRCROOT/../tunnel/build/FlexarrTunnel.xcframework/macos-arm64" ] || PATH="$PATH:/opt/homebrew/bin:/usr/local/go/bin" make -C "$SRCROOT/../.." tunnel-apple
    # The iPad's screens and downloads are compiled in from FlexarriOS (the Mac counts as a regular size class); what's
    # the phone's alone (CarPlay, the Apple TV remote, widgets, its app delegate) stays out.
    sources:
      - Shared
      - FlexarrMac
      - path: FlexarriOS/Screens
        # The phone's tab bar; the Mac has its own sidebar (FlexarrMac/App/MacMainView.swift).
        excludes: [MainTabView.swift]
      - FlexarriOS/Design
      - FlexarriOS/Downloads
      - FlexarriOS/App/PairingPrompts.swift
      - FlexarriOS/App/PushNotifications.swift
      - FlexarriOS/App/ReviewPrompt.swift
      - Languages/Localizable.xcstrings
      - Languages/AppShortcuts.xcstrings
      - Languages/FlexarrMac/InfoPlist.xcstrings
    dependencies:
      - package: FlexarrKit
      - package: AetherEngine
      - package: Sentry
        product: Sentry
      # Tailscale built in, for family guests (clients/tunnel's macos slice).
      - framework: ../tunnel/build/FlexarrTunnel.xcframework
        embed: false
      - target: FlexarrMacNotificationService
    info:
      path: FlexarrMac/Info.plist
      properties:
        CFBundleDisplayName: Flexarr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        # Big Shoulders Display, the marquee type (Shared/Fonts), copied to Resources.
        ATSApplicationFontsPath: .
        FlexarrGuestInvites: $(FLEXARR_GUEST_INVITES)
        # "direct" in the copy downloaded from flexarr.io (scripts/mac-player-dmg.sh), which then says when a newer
        # one is out; the App Store's updates itself.
        FlexarrDistribution: $(FLEXARR_DISTRIBUTION)
        # Shared with the notification extension, which opens the server's sealed notifications with the key kept there.
        FlexarrAppGroup: group.$(FLEXARR_MAC_PLAYER_BUNDLE_ID)
        # Export compliance: as the iPhone app's (see FlexarriOS).
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Flexarr looks for your Flexarr server on your home network so you can connect without typing an address, then streams from it. For example, it finds the server on your Mac and plays your movies, shows, music and podcasts from it."
        NSBonjourServices: [_flexarr._tcp]
        CFBundleURLTypes:
          - CFBundleURLName: io.github.flexarr.mac
            CFBundleURLSchemes: [flexarr]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLEXARR_MAC_PLAYER_BUNDLE_ID)
        PRODUCT_NAME: Flexarr
        # Apple silicon only (docs/mac-player.md).
        ARCHS: arm64
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # The sandbox, the network and files: enough to run it at home unsigned or ad hoc. The store's build passes
        # FLEXARR_MAC_ENTITLEMENTS=FlexarrMac/FlexarrMac-Store.entitlements, which adds notifications (APNs) and the app
        # group shared with the notification extension; those need the provisioning profile the upload signs with.
        FLEXARR_MAC_ENTITLEMENTS: FlexarrMac/FlexarrMac.entitlements
        CODE_SIGN_ENTITLEMENTS: $(FLEXARR_MAC_ENTITLEMENTS)
        FLEXARR_DISTRIBUTION: store
  # Opens the server's sealed notifications on the Mac, as FlexarrNotificationService does on the iPhone (same source).
  FlexarrMacNotificationService:
    type: app-extension
    platform: macOS
    sources:
      - path: NotificationService/NotificationService.swift
      - path: NotificationService/PrivacyInfo.xcprivacy
    dependencies:
      - package: FlexarrKit
    info:
      path: FlexarrMacNotificationService/Info.plist
      properties:
        CFBundleDisplayName: Flexarr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FlexarrAppGroup: group.$(FLEXARR_MAC_PLAYER_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLEXARR_MAC_PLAYER_BUNDLE_ID).NotificationService
        ARCHS: arm64
        ENABLE_HARDENED_RUNTIME: YES
        FLEXARR_MAC_NOTIFICATION_ENTITLEMENTS: FlexarrMacNotificationService/FlexarrMacNotificationService.entitlements
        CODE_SIGN_ENTITLEMENTS: $(FLEXARR_MAC_NOTIFICATION_ENTITLEMENTS)
  # Podcast widgets for the Home Screen and Lock Screen: Continue listening and Up Next, from what the app saves.
  FlexarrWidgets:
    type: app-extension
    platform: iOS
    # Tokens.swift is the design tokens (colours, radii) the app uses, so the widgets match it.
    sources: [Widgets, WidgetShared, Shared/Design/Tokens.swift]
    # For t(): the widgets show the app's language, from the pack it keeps in the App Group.
    dependencies:
      - package: FlexarrKit
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Flexarr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FlexarrAppGroup: group.$(FLEXARR_IOS_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLEXARR_IOS_BUNDLE_ID).widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        # As the app's (see FLEXARR_IOS_ENTITLEMENTS).
        FLEXARR_WIDGET_ENTITLEMENTS: ""
        "FLEXARR_WIDGET_ENTITLEMENTS[sdk=iphonesimulator*]": Widgets/FlexarrWidgets.entitlements
        CODE_SIGN_ENTITLEMENTS: $(FLEXARR_WIDGET_ENTITLEMENTS)
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET
  # Opens the server's sealed notifications (the relay only carries "Something new is ready"): the real text, buttons
  # and artwork. The key it opens them with is in the Keychain, under the app group (see NotificationKey).
  FlexarrNotificationService:
    type: app-extension
    platform: iOS
    sources: [NotificationService]
    dependencies:
      - package: FlexarrKit
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Flexarr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FlexarrAppGroup: group.$(FLEXARR_IOS_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLEXARR_IOS_BUNDLE_ID).NotificationService
        TARGETED_DEVICE_FAMILY: "1,2"
        # As the app's (see FLEXARR_IOS_ENTITLEMENTS).
        FLEXARR_NOTIFICATION_ENTITLEMENTS: ""
        "FLEXARR_NOTIFICATION_ENTITLEMENTS[sdk=iphonesimulator*]": NotificationService/NotificationService.entitlements
        CODE_SIGN_ENTITLEMENTS: $(FLEXARR_NOTIFICATION_ENTITLEMENTS)
  # Smoke test that walks the app against a live server and saves screenshots.
  # Skipped unless FLEXARR_SERVER and FLEXARR_KEY are passed (as TEST_RUNNER_FLEXARR_*).
  FlexarriOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FlexarriOSUITests]
    dependencies:
      - target: FlexarriOS
      - package: FlexarrKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.flexarr.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FlexarriOS
  # Remote-driven smoke test that walks the app against a live server and saves screenshots.
  # Skipped unless FLEXARR_SERVER and FLEXARR_KEY are passed (as TEST_RUNNER_FLEXARR_*).
  FlexarrTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources: [FlexarrTVUITests]
    dependencies:
      - target: FlexarrTV
      - package: FlexarrKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.flexarr.tv.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FlexarrTV
schemes:
  FlexarriOS:
    build:
      targets:
        FlexarriOS: all
    test:
      targets:
        - FlexarriOSUITests
  FlexarrTV:
    build:
      targets:
        FlexarrTV: all
    test:
      targets:
        - FlexarrTVUITests
  FlexarrMac:
    build:
      targets:
        FlexarrMac: all
